<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}The Price of Breathing{% endblock %}</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
    </head>
    <body>
        <nav>
            <a href="{{ url_for('index') }}" class="nav-brand"
                >The Price of Breathing</a
            >
            <a href="{{ url_for('about') }}">About &amp; Sources</a>
        </nav>

        <main>{% block content %}{% endblock %}</main>

        <footer>
            <p>
                A data-driven investigation into air pollution inequality across
                Europe.
            </p>
            <p>Built for DE -- University of Amsterdam, 2026.</p>
        </footer>

        {% block scripts %}{% endblock %}
    </body>
</html>
